services:
  # 우리가 직접 빌드하는 클릭 로그 API
  api:
    build: ./api
    ports:
      - "8000:8000"            # 내 컴퓨터 8000 → 컨테이너 8000
    environment:
      DB_HOST: postgres        # localhost가 아니라 "서비스 이름"으로 DB를 찾아간다
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy   # postgres가 "준비 완료(healthy)"된 뒤에 시작

  # 클릭 로그를 저장하는 DB (포트를 열지 않음: 컨테이너끼리는 내부 네트워크로 통신)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # [6단계] 아래 줄의 "# " 두 글자만 지우세요 (앞쪽 공백은 그대로 두기)
      # - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 브라우저에서 DB를 보는 관리 도구
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"            # 내 컴퓨터 8080 → 컨테이너 8080

# [6단계] 아래 두 줄의 맨 앞 "# " 두 글자만 지우세요
# volumes:
#   pgdata:
